name: 功能提审
description: 提出新功能或现有体验的改进建议。
title: "[Feat] "
body:
  - type: markdown
    attributes:
      value: |
        请从使用场景出发描述建议，不需要提供技术方案。Issue 内容公开可见，请勿提交密码、登录凭证或其他不希望公开的个人信息；示例请使用虚构数据。
        提交建议不代表已安排开发，我们会结合项目定位和实际使用需求评估。
  - type: checkboxes
    id: preparation
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，没有找到相同建议。
          required: true
        - label: 我已检查内容及附件，没有包含不希望公开的个人信息或登录凭证。
          required: true
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景与当前问题
      description: 你在什么情况下遇到不便？目前是怎样处理的？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望增加或调整的功能
      description: 请描述入口、操作过程和预期结果；每个 Issue 尽量聚焦一个需求。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 怎样算满足需求
      description: 用一个具体例子说明功能完成后的行为。
      placeholder: 当我……时，可以……，最终……。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案（可选）
      description: 是否考虑过其他做法，或者现有功能能否部分满足需求？
  - type: textarea
    id: additional
    attributes:
      label: 补充说明或示意图（可选）
      description: 可以补充使用频率、相关界面或已遮挡个人信息的示意图。
